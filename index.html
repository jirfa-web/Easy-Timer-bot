<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Timer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #fff;
            padding-top: 20px;
        }

        h1 {
            margin: 0 0 20px 0;
            color: #ff9500;
            font-size: 1.5rem;
            align-self: flex-start;
            margin-left: 20px;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff9500;
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            background: #ff9500;
            color: #000;
            /* ЧЕРНЫЙ ТЕКСТ */
        }

        /* Кнопки: Стоп и Сброс (Черный фон, оранжевый текст) */
        button:nth-child(2),
        button:nth-child(4) {
            background: #000;
            color: #ff9500;
            /* ОРАНЖЕВЫЙ ТЕКСТ */
            border: 1px solid #ff9500;
        }

        #laps {
            width: 90%;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }
    </style>
</head>

<body>
    <h1>Easy Timer</h1>
    <div id="timer">00:00:00.0</div>
    <div class="buttons">
        <button onclick="start()">Старт</button>
        <button onclick="stop()">Стоп</button>
        <button onclick="lap()">Круг</button>
        <button onclick="reset()">Сброс</button>
    </div>
    <div id="laps"></div>

    <script>
        let ms = 0, timer;
        const display = document.getElementById('timer');
        const lapsContainer = document.getElementById('laps');

        function updateDisplay() {
            let h = Math.floor(ms / 36000), m = Math.floor((ms % 36000) / 600), s = Math.floor((ms % 600) / 10), mil = ms % 10;
            display.innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${mil}`;
        }

        function start() { if (!timer) timer = setInterval(() => { ms++; updateDisplay(); }, 100); }
        function stop() { clearInterval(timer); timer = null; }
        function reset() { stop(); ms = 0; updateDisplay(); lapsContainer.innerHTML = ''; }
        function lap() {
            let div = document.createElement('div');
            div.className = 'lap-item';
            div.innerHTML = `<span>Круг ${lapsContainer.children.length + 1}</span> <span>${display.innerText}</span>`;
            lapsContainer.prepend(div);
        }
    </script>
</body>

</html>
