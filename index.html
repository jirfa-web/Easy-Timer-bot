<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Timer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #fff;
            padding-top: 20px;
        }

        h1 {
            margin: 0 0 20px 0;
            color: #ff9500;
            font-size: 1.5rem;
            align-self: flex-start;
            margin-left: 20px;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff9500;
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        /* Контейнер для кнопок: 3 в ряд, Сброс внизу */
        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            margin-bottom: 20px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px 5px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            background: #ff9500;
            color: #000;
        }

        /* Кнопка сброс - растянутая */
        .reset-btn {
            width: 100%;
            background: #000;
            color: #ff9500;
            border: 1px solid #ff9500;
        }

        /* Стоп - тоже черный */
        .stop-btn {
            background: #000;
            color: #ff9500;
            border: 1px solid #ff9500;
        }

        #laps {
            width: 90%;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }
    </style>
</head>

<body>
    <h1>Easy Timer</h1>
    <div id="timer">00:00:00.0</div>
    <div class="buttons-wrapper">
        <div class="top-row">
            <button onclick="start()">Старт</button>
            <button onclick="stop()" class="stop-btn">Стоп</button>
            <button onclick="lap()">Круг</button>
        </div>
        <button onclick="reset()" class="reset-btn">Сброс</button>
    </div>

    <script>
        let ms = 0, timer;
        const display = document.getElementById('timer');
        const lapsContainer = document.getElementById('laps');
        const modal = document.getElementById('pro-modal');

        function updateDisplay() {
            let h = Math.floor(ms / 36000), m = Math.floor((ms % 36000) / 600), s = Math.floor((ms % 600) / 10), mil = ms % 10;
            display.innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${mil}`;
        }

        function start() {
            if (!timer) timer = setInterval(() => { ms++; updateDisplay(); }, 100);
        }

        function stop() {
            clearInterval(timer);
            timer = null;
        }

        function reset() {
            stop();
            ms = 0;
            updateDisplay();
            lapsContainer.innerHTML = '';
            // Если вдруг окно открыто, закрываем его при сбросе
            modal.style.display = 'none';
        }

        function lap() {
            let count = lapsContainer.children.length + 1;

            // Сначала создаем запись круга
            let div = document.createElement('div');
            div.className = 'lap-item';
            div.innerHTML = `<span>Круг ${count}</span> <span>${display.innerText}</span>`;
            lapsContainer.prepend(div);

            // Потом проверяем, нужно ли показать окно
            if (count === 3) {
                modal.style.display = 'flex';
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
    <!-- Окно подписки -->
    <div id="pro-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); flex-direction:column; align-items:center; justify-content:center; z-index:10;">
        <h2 style="color:#ff9500;">Easy Timer PRO</h2>
        <ul style="color:white; text-align:left;">
            <li>✅ Неограниченное время</li>
            <li>✅ Бесконечные круги</li>
            <li>✅ Личное уважение от меня</li>
        </ul>
        <p style="font-size: 2rem; font-weight: bold;">$99/мес</p>
        <button onclick="closeModal()">Купить за $99</button>
    </div>
</body>

</html>
