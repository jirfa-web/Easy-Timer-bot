<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        #timer { font-size: 3rem; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 1rem; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="timer">00:00:00</div>
    <div>
        <button onclick="start()">Старт</button>
        <button onclick="stop()">Стоп</button>
        <button onclick="reset()">Сброс</button>
    </div>

    <script>
        let seconds = 0, timer;
        const display = document.getElementById('timer');

        function updateDisplay() {
            let hrs = Math.floor(seconds / 3600).toString().padStart(2, '0');
            let mins = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            let secs = (seconds % 60).toString().padStart(2, '0');
            display.innerText = `${hrs}:${mins}:${secs}`;
        }

        function start() { if(!timer) timer = setInterval(() => { seconds++; updateDisplay(); }, 1000); }
        function stop() { clearInterval(timer); timer = null; }
        function reset() { stop(); seconds = 0; updateDisplay(); }
    </script>
</body>
</html>
